name: Package one platform

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      os:
        required: true
        type: string
      asset:
        required: true
        type: string

      package:
        required: true
        type: string
      abi:
        required: true
        type: string
      target:
        required: true
        type: string
      rust_target:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: src-tauri
          shared-key: jotpoc-${{ inputs.package }}
          cache-bin: false
      - run: pnpm install --frozen-lockfile
      - if: inputs.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Restore Android NDK
        if: inputs.platform == 'android'
        uses: ./.github/actions/android-ndk
      - name: Set up Gradle caching
        if: inputs.platform == 'android'
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Install Linux build dependencies
        if: inputs.platform == 'linux'
        run: bash .github/packages/linux-deps.sh
      - name: Compile Windows or Linux application
        if: inputs.platform == 'windows' || inputs.platform == 'linux'
        run: pnpm tauri build --no-bundle
      - name: Package installer
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
          ANDROID_TARGET: ${{ inputs.target }}
          ANDROID_ABI: ${{ inputs.abi }}
          ANDROID_RUST_TARGET: ${{ inputs.rust_target }}
        run: bash ".github/packages/$PLATFORM.sh"
      - name: Sign Android release
        if: inputs.platform == 'android'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash .github/packages/android-sign.sh
      - name: Validate installer size and Android architecture
        shell: python
        env:
          ASSET: ${{ inputs.asset }}
          ABI: ${{ inputs.abi }}
        run: |
          import os
          from pathlib import Path
          from zipfile import ZipFile
          files = list(Path(".").glob(os.environ["ASSET"]))
          if len(files) != 1:
              raise SystemExit(f"Expected one installer, found {files}")
          file = files[0]
          size = file.stat().st_size
          print(f"{file}: {size / 2**20:.2f} MiB")
          if not 0 < size <= 25 * 2**20:
              raise SystemExit("Installer exceeds the Pages limit or is empty")
          if abi := os.environ["ABI"]:
              with ZipFile(file) as apk:
                  abis = {p.split("/")[1] for p in apk.namelist() if p.startswith("lib/") and p.endswith(".so")}
              if abis != {abi}:
                  raise SystemExit(f"Expected {abi}, found {abis}")
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.package }}
          path: ${{ inputs.asset }}
          compression-level: 0
          if-no-files-found: error
