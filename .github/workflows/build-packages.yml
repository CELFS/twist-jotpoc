name: Build client packages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to rebuild
        type: choice
        default: all
        options: [all, macos, windows, linux, android]

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.packages.outputs.targets }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: packages
        env:
          BEFORE: ${{ github.event.before }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          targets=$(python3 .github/packages/select.py "$BEFORE" "$GITHUB_SHA" "$PLATFORM")
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  package:
    needs: select
    if: needs.select.outputs.targets != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.targets) }}
    uses: ./.github/workflows/package-platform.yml
    with:
      platform: ${{ matrix.platform }}
      os: ${{ matrix.os }}
      asset: ${{ matrix.asset }}
    secrets: inherit
