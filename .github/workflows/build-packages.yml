name: Build client packages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to rebuild
        type: choice
        default: all
        options: [all, macos, windows, linux, android, android-arm64-v8a, android-armeabi-v7a, android-x86, android-x86_64]

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.packages.outputs.targets }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: packages
        env:
          BEFORE: ${{ github.event.before }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          targets=$(python3 .github/packages/select.py "$BEFORE" "$GITHUB_SHA" "$PLATFORM")
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
      - name: Prepare shared Android NDK
        if: contains(fromJSON(steps.packages.outputs.targets).*.platform, 'android')
        continue-on-error: true
        uses: ./.github/actions/android-ndk
        with:
          prime: 'true'

  package:
    needs: select
    if: needs.select.outputs.targets != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.targets) }}
    uses: ./.github/workflows/package-platform.yml
    with:
      platform: ${{ matrix.platform }}
      os: ${{ matrix.os }}
      asset: ${{ matrix.asset }}
      package: ${{ matrix.package }}
      abi: ${{ matrix.abi }}
      target: ${{ matrix.target }}
      rust_target: ${{ matrix.rust_target }}
    secrets: inherit

  android-timings:
    needs: [select, package]
    if: "!cancelled() && needs.select.result == 'success' && needs.select.outputs.targets != '[]'"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Report full package times and Android stages
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I .github/packages/android-timings.py >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [select, package]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && needs.select.result == 'success' &&
      (needs.package.result == 'success' || needs.package.result == 'failure')
    runs-on: ubuntu-latest
    concurrency:
      group: jotpoc-download-publication
      queue: max
    steps:
      - uses: actions/checkout@v6
        with:
          path: client
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: packages
      - name: Check validated packages available for publication
        id: available
        shell: python
        env:
          TARGETS: ${{ needs.select.outputs.targets }}
          RESULT: ${{ needs.package.result }}
        run: |
          import json
          import os
          from pathlib import Path
          expected = {target["package"] for target in json.loads(os.environ["TARGETS"])}
          actual = {path.name for path in Path("packages").glob("*") if path.is_dir()}
          if not actual <= expected or (os.environ["RESULT"] == "success" and expected != actual):
              raise SystemExit(f"Expected {sorted(expected)}, received {sorted(actual)}")
          print(f"Available: {sorted(actual)}; missing: {sorted(expected - actual)}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"publish={str(bool(actual)).lower()}", file=output)
              print(f"android={str(any(name.startswith('android-') for name in actual)).lower()}", file=output)
      - if: steps.available.outputs.android == 'true'
        run: |
          if [[ ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
          fi
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
      - if: steps.available.outputs.publish == 'true'
        uses: actions/create-github-app-token@v3
        id: token
        with:
          client-id: ${{ vars.TWB_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.TWB_SYNC_APP_PRIVATE_KEY }}
          owner: CELFS
          repositories: twist-balance
          permission-contents: write
      - if: steps.available.outputs.publish == 'true'
        uses: actions/checkout@v6
        with:
          repository: CELFS/twist-balance
          ref: main
          path: site
          token: ${{ steps.token.outputs.token }}
      - name: Synchronize release packages and download entries
        if: steps.available.outputs.publish == 'true'
        env:
          BOT: ${{ steps.token.outputs.app-slug }}[bot]
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          git -C site config user.name "$BOT"
          git -C site config user.email "$(gh api "/users/$BOT" --jq .id)+$BOT@users.noreply.github.com"
          for attempt in 1 2 3; do
            git -C site fetch --quiet origin main
            tree="$RUNNER_TEMP/site-$attempt"
            git -C site worktree add --quiet --detach "$tree" origin/main
            python3 "$tree/claude_jobs/scripts/sync-jotpoc-release.py" client packages
            git -C "$tree" add -- src/extension/jotpoc-release.json src/extension/jotpoc-build-hashes.json public/downloads/jotpoc
            if git -C "$tree" diff --cached --quiet; then
              echo "Download entries are already up to date."
              exit 0
            fi
            git -C "$tree" commit --quiet -m "chore: sync JotPoc packages for ${GITHUB_SHA:0:12}"
            if git -C "$tree" push --quiet origin HEAD:main; then
              echo "Release packages and download entries synchronized."
              exit 0
            fi
            echo "Publication attempt $attempt failed."
          done
          echo "::error::Release package publication failed after three attempts."
          exit 1
