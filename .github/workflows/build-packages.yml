name: Build client packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-15
            asset: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - platform: windows
            os: windows-2022
            asset: src-tauri/target/release/bundle/nsis/*.exe
          - platform: linux
            os: ubuntu-24.04
            asset: src-tauri/target/release/bundle/deb/*.deb
          - platform: android
            os: ubuntu-24.04
            asset: packages/JotPoc.apk
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev libdbus-1-dev
          pnpm tauri build --bundles deb
      - if: matrix.platform == 'macos'
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          pnpm tauri build --target universal-apple-darwin --bundles dmg
      - if: matrix.platform == 'windows'
        run: pnpm tauri build --bundles nsis
      - if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - if: matrix.platform == 'android'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"
          export NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          pnpm tauri android init --ci
          config=$(printf '{"bundle":{"android":{"versionCode":%d}}}' "$GITHUB_RUN_NUMBER")
          pnpm tauri android build --ci --apk --config "$config"
      - name: Sign Android release
        if: matrix.platform == 'android'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          : "${KEYSTORE:?Configure the Android release keystore}"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          mapfile -t apks < <(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk')
          test "${#apks[@]}" = 1
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
          mkdir -p packages
          "$tools/zipalign" -P 16 -f 4 "${apks[0]}" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out packages/JotPoc.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify packages/JotPoc.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    if: "!cancelled() && github.ref == 'refs/heads/main'"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [macos, windows, linux, android]
    concurrency:
      group: jotpoc-download-publication
      queue: max
    steps:
      - uses: actions/checkout@v6
        with:
          path: client
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: packages/${{ matrix.platform }}
      - if: matrix.platform == 'android'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
      - uses: actions/create-github-app-token@v3
        id: token
        with:
          client-id: ${{ vars.TWB_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.TWB_SYNC_APP_PRIVATE_KEY }}
          owner: CELFS
          repositories: twist-balance
          permission-contents: write
      - uses: actions/checkout@v6
        with:
          repository: CELFS/twist-balance
          ref: main
          path: site
          token: ${{ steps.token.outputs.token }}
      - name: Synchronize installer and download entry
        env:
          BOT: ${{ steps.token.outputs.app-slug }}[bot]
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          git -C site config user.name "$BOT"
          git -C site config user.email "$(gh api "/users/$BOT" --jq .id)+$BOT@users.noreply.github.com"
          for attempt in 1 2 3; do
            git -C site fetch origin main
            tree="$RUNNER_TEMP/site-$attempt"
            git -C site worktree add --detach "$tree" origin/main
            python3 "$tree/claude_jobs/scripts/sync-jotpoc-release.py" client packages
            git -C "$tree" add -- src/extension/jotpoc-release.json public/downloads/jotpoc
            git -C "$tree" diff --cached --quiet && exit 0
            git -C "$tree" commit -m "chore: sync JotPoc ${{ matrix.platform }} package for ${GITHUB_SHA:0:12}"
            git -C "$tree" push origin HEAD:main && exit 0
          done
          exit 1
