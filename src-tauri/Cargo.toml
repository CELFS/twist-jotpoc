[package]
name = "twist-jotpoc"
version = "1.0.1"
edition = "2021"

[lib]
name = "jotpoc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
tauri-plugin-http = "2"
tauri-plugin-secure-keystore = "=0.0.2"
